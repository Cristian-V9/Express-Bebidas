<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Error 400 - Solicitud Incorrecta</title>
  <link rel="stylesheet" href="../css/errores.css">
</head>
<body>
  <div class="contenedor">
    <h1 class="codigo">400</h1>
    <h2>Solicitud Incorrecta</h2>
    <p class="explicacion">
      Este error significa que la peticion que enviaste no tiene el formato correcto.
      Por ejemplo, si el ID del producto no es un numero valido o si falta ese dato en la url.
    </p>
    <a href="/" class="volver">Volver al buscador</a>
  </div>
</body>
</html>
