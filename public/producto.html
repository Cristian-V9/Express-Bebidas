<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>UCompensar - Detalle de Producto</title>
  <link rel="stylesheet" href="css/producto.css">
</head>
<body>
  <div class="contenedor">
    <h1>Detalle del Producto</h1>

    <table>
      <tr>
        <th>Campo</th>
        <th>Valor</th>
      </tr>
      <tr>
        <td>ID</td>
        <td>{{id}}</td>
      </tr>
      <tr>
        <td>Nombre</td>
        <td>{{nombre}}</td>
      </tr>
      <tr>
        <td>Marca</td>
        <td>{{marca}}</td>
      </tr>
      <tr>
        <td>Categoria</td>
        <td>{{categoria}}</td>
      </tr>
      <tr>
        <td>Precio</td>
        <td>${{precio}}</td>
      </tr>
      <tr>
        <td>Stock</td>
        <td>{{stock}}</td>
      </tr>
      <tr>
        <td>Descripcion</td>
        <td>{{descripcion}}</td>
      </tr>
    </table>

    <a href="/" class="volver">Volver al buscador</a>
  </div>
</body>
</html>
